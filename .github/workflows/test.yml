name: Application

on:
  push:
    paths-ignore: ['**.md', 'THIRD_PARTY_LICENSES.txt', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'THIRD_PARTY_LICENSES.txt', 'LICENSE']

permissions:
  contents: read

jobs:
  native-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build, vet, and test on native runner
        run: |
          go build ./...
          go vet ./...
          go test -race ./...
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Verify formatting and generated request contract
        run: |
          test -z "$(gofmt -l cmd internal)"
          go run ./cmd/contract > /tmp/openapi.json
          diff -u docs/openapi.json /tmp/openapi.json
      - name: Exercise real binary and persistent server
        run: python3 scripts/smoke.py
